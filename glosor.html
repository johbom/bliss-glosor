<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bliss-glosor</title>
<meta name="claude:viewport-fit-sides" content="cover" />
<!-- PWA: manifest, ikoner och service worker (glosor-sw.js). Raderna märkta data-pwa tas bort i Artifact-versionen. -->
<link rel="manifest" href="glosor.webmanifest" data-pwa />
<!-- Samma färg som sidans bakgrund (--bg), så att Safari inte tonar toppkanten i en annan färg. -->
<meta name="theme-color" content="#ECEBE6" media="(prefers-color-scheme: light)" data-pwa />
<meta name="theme-color" content="#17181B" media="(prefers-color-scheme: dark)" data-pwa />
<meta name="mobile-web-app-capable" content="yes" data-pwa />
<meta name="apple-mobile-web-app-capable" content="yes" data-pwa />
<meta name="apple-mobile-web-app-title" content="Bliss-glosor" data-pwa />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" data-pwa />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" data-pwa />
<style>
/* Atkinson Hyperlegible (Braille Institute, SIL Open Font License 1.1 – se fonts/OFL.txt).
   Ligger i appen i stället för att hämtas från Google Fonts: inga anrop till andra tjänster, och den fungerar offline. */

@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-400-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-700-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-700-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Atkinson Hyperlegible";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-400i-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Atkinson Hyperlegible";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-400i-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{
  --ink:#1B1B1D; --dim:#6E6E73; --panel:#FFFFFF; --panel-2:#F4F3EF; --bg:#ECEBE6;
  --accent:#28558C; --accent-ink:#FFFFFF; --accent-soft:#DCE6F2; --rule:#DAD7CE;
  --ok:#2E7D46; --ok-soft:#DDF0E2; --bad:#B23A3A; --bad-soft:#F6DEDE; --staff:#D9D5CA;
  --c-YELLOW:#E9C23B; --c-RED:#D9534F; --c-GREEN:#4CAF6A; --c-BLUE:#4A7FD0; --c-WHITE:#C8C6C0; --c-GRAY:#8E8E8E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#ECECEE; --dim:#9A9AA2; --panel:#1F2023; --panel-2:#26282A; --bg:#17181B;
  --accent:#7FA8DB; --accent-ink:#0E1621; --accent-soft:#223146; --rule:#33363B;
  --ok:#6FBF8A; --ok-soft:#1E3326; --bad:#E07B7B; --bad-soft:#3A2224; --staff:#34373C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ink:#ECECEE; --dim:#9A9AA2; --panel:#1F2023; --panel-2:#26282A; --bg:#17181B;
  --accent:#7FA8DB; --accent-ink:#0E1621; --accent-soft:#223146; --rule:#33363B;
  --ok:#6FBF8A; --ok-soft:#1E3326; --bad:#E07B7B; --bad-soft:#3A2224; --staff:#34373C;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
body{font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.4}
html{background:var(--bg)}
/* iPhone: Safari tonar annars toppkanten med en suddig övergång (temafärgen används inte längre).
   Ett fast fält i bakgrundsfärgen bakom statusraden ger en ren kant, och sidhuvudet börjar under det. */
.statusbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
button{font:inherit;color:inherit;cursor:pointer}
header,main{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:14px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:12px;flex-wrap:wrap}
header h1{font-size:20px}
header nav{margin-left:auto;display:flex;gap:4px}
header nav button{background:none;border:0;padding:6px 12px;border-radius:8px;color:var(--dim)}
header nav button[aria-current="true"]{background:var(--panel);color:var(--ink);font-weight:600}
.lang-toggle{background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--accent)}
.lang-toggle:hover{border-color:var(--accent)}
/* Smal skärm: rubrik och språkknapp på första raden, menyn på en egen rad under – samma på båda språken. */
@media (max-width:520px){
  header{gap:8px 14px}
  .lang-toggle{order:1;margin-left:auto}
  header nav{order:2;flex-basis:100%;margin-left:0}
}
main{padding-block:0 40px}
.panel{background:var(--panel);border-radius:14px;padding:20px}
.panel + .panel{margin-top:14px}
h2{font-size:17px;margin-bottom:12px}
.muted{color:var(--dim)}
.small{font-size:13px}

/* översikt */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel-2);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--dim)}
.bar{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:600}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:none;border:1px solid var(--rule);border-radius:10px;padding:10px 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.settings label{display:flex;gap:8px;align-items:center;padding:4px 0}
.settings fieldset{border:0;padding:0;margin:0 0 12px}
.settings legend{font-weight:600;margin-bottom:4px}
.settings input[type=number]{width:64px;font:inherit;padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--panel-2);color:var(--ink)}
.danger{color:var(--bad);background:none;border:0;padding:0;text-decoration:underline}
.linklike{color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;font:inherit}
.prose{max-width:68ch}
.prose h2{font-size:20px;margin:0 0 8px}
.prose h3{font-size:16px;margin:22px 0 6px}
.prose p,.prose li{font-size:15px;line-height:1.55}
.prose p + p{margin-top:8px}
.prose ul,.prose ol{padding-left:20px;margin:6px 0 0}
.prose a{color:var(--accent)}
.prose blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--rule);color:var(--dim);font-size:14px}
.lic{display:grid;gap:10px;margin-top:8px}
.lic div{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45}
.lic b{display:block}
.lic .who{color:var(--dim)}
.promo{margin:20px 0 4px;padding:16px 18px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--accent)}
.promo-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--accent)}
.prose .promo h3{margin:2px 0 6px;font-size:18px}
.promo-link{display:inline-block;margin-top:10px;padding:8px 16px;border-radius:10px;background:var(--accent);color:var(--accent-ink)!important;font-weight:700;text-decoration:none}
.promo-link:hover{filter:brightness(1.08)}
.milestone{display:grid;gap:8px;padding:14px 16px;margin-bottom:16px;border-radius:12px;background:var(--accent-soft)}
.ms-track{display:grid;gap:6px}
.ms-ranks{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ms-rank{display:flex;align-items:center;gap:8px}
.ms-lbl{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.ms-arrow{color:var(--dim);font-size:18px}
.rank{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:2px 12px 2px 6px}
.rank .sym{color:var(--accent)}
.rank-name{font-weight:700;font-size:15px}
.ms-rank.next .rank{background:transparent;border:1px dashed var(--accent)}
.ms-hit{display:flex;align-items:center;gap:10px}
.ms-hit-sym{flex:none;background:var(--accent-ink);border-radius:8px;padding:2px 4px}
.ms-hit-sym .sym{color:var(--accent)}
.ms-track + .ms-track{padding-top:10px;border-top:1px solid var(--rule)}
.ms-title{font-weight:700;font-size:15px}
.ms-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.ms-count{font-size:15px;font-variant-numeric:tabular-nums}
.ms-count b{font-size:20px}
.ms-bar{height:14px;border-radius:7px;background:var(--panel);overflow:hidden;border:1px solid var(--rule)}
.ms-bar i{display:block;height:100%;background:var(--accent);border-radius:7px;transition:width .4s ease}
@media (prefers-reduced-motion: reduce){.ms-bar i{transition:none}}
.ms-chips{display:flex;flex-wrap:wrap;gap:6px}
.ms-chip{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 9px;border-radius:999px;border:1px solid var(--rule);color:var(--dim);background:var(--panel)}
.ms-chip.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ms-chip.next{border-color:var(--accent);color:var(--accent)}
.ms-note{font-size:12px;color:var(--dim)}
.ms-all{font-weight:700}
.ms-hit + .ms-hit{margin-top:-4px}
.ms-hit{margin:-2px 0 10px;padding:10px 12px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:15px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.link-card{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:12px;background:var(--panel-2);
  border:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.prose .link-card{color:var(--ink)}
.link-card:hover{border-color:var(--accent)}
.link-card span{font-size:14px;color:var(--dim)}
.link-card .link-url{color:var(--accent);font-weight:700;font-size:13px}
.flyer{display:flex;gap:14px;align-items:flex-start}
.flyer-doc{flex:none;width:52px;height:68px;border-radius:6px;background:var(--panel-2);border:1px solid var(--rule);
  position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.flyer-doc::before{content:"";position:absolute;top:0;left:0;right:0;height:18px;background:var(--accent);border-radius:6px 6px 0 0}
.flyer-doc span{font-size:11px;font-weight:700;color:var(--accent)}
.flyer p{margin:0}
.contact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.contact a{font-size:17px;font-weight:700;user-select:all}
.contact .ghost{padding:6px 12px;font-size:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.head h2{margin:0}
.star{color:var(--c-YELLOW);font-size:13px;line-height:1}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{background:none;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--dim)}
.tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.backup .row{margin-top:6px}
.backup .ghost{padding:8px 14px}
.backup-msg:empty{display:none}
.backup-msg{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--panel-2)}
.backup-msg.good{background:var(--ok-soft)} .backup-msg.bad{background:var(--bad-soft)}
.confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--bad-soft)}
.confirm .ghost{padding:8px 14px}
.confirm .yes{background:var(--bad);color:var(--panel);border:0;border-radius:10px;padding:8px 14px;font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* symboler */
.sym{display:block;max-width:100%;height:auto;color:var(--ink)}
.sym .staff{stroke:var(--staff);stroke-width:10}
.sym .staff.earth{stroke-width:16}
.stage{display:flex;justify-content:center;padding:8px 0 4px}
.chip{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:var(--panel-2);border:1px solid transparent;
  border-radius:10px;padding:6px 8px;font-size:13px;max-width:160px;text-align:center}
.chip span{overflow-wrap:anywhere}
.sentence{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:4px;padding:10px 0 4px}
.sentence .sw{margin:0;display:flex;flex-direction:column;align-items:center}
.sentence .sw figcaption{font-size:13px;color:var(--dim);margin-top:-4px}
.sentence .sw.hit .sym{color:var(--accent)}
.sentence .sw.hit figcaption{color:var(--accent);font-weight:700}
.blank{display:inline-flex;align-items:center;justify-content:center;width:64px;height:118px;margin:8px 6px 0;
  border:2px dashed var(--accent);border-radius:10px;color:var(--accent);font-size:28px;font-weight:700;background:var(--accent-soft)}
.feedback .sentence{justify-content:flex-start;padding-bottom:0}
.bare-form{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 8px}
.bare-label{font-size:13px;color:var(--dim)}
.merged-note{font-size:13px;color:var(--dim);margin:2px 0 6px;padding-left:10px;border-left:3px solid var(--accent-soft)}
.chip .note{font-size:11px;color:var(--accent);font-style:italic}
.chip.txt{justify-content:center;min-height:64px;font-style:italic;color:var(--dim);cursor:default}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.op{font-size:22px;color:var(--dim);padding:0 2px}
.cls{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--dim)}
.cls::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c-WHITE)}
.cls-YELLOW::before{background:var(--c-YELLOW)} .cls-RED::before{background:var(--c-RED)}
.cls-GREEN::before{background:var(--c-GREEN)} .cls-BLUE::before{background:var(--c-BLUE)}
.cls-GRAY::before{background:var(--c-GRAY)}

/* pass */
.progress{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px;color:var(--dim)}
.kicker{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
.prompt{font-size:20px;margin:4px 0 6px}
.word{font-size:28px;font-weight:700}
.syns{color:var(--dim);font-size:14px}
.expl{font-size:14px;color:var(--dim);font-style:italic;margin-top:6px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.opt{position:relative;background:var(--panel-2);border:2px solid transparent;border-radius:12px;padding:14px;font-size:18px;
  display:flex;justify-content:center;align-items:center;min-height:64px}
.opt:hover:not(:disabled),.chip:hover:not(.txt){border-color:var(--accent)}
.opt .k,.pal .k{position:absolute;top:6px;left:8px;font-size:11px;color:var(--dim)}
.opt.ok,.pal.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad,.pal.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt.miss,.pal.miss{border-color:var(--ok);border-style:dashed}
.opt:disabled{cursor:default}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:14px}
.pal{position:relative;max-width:none;width:100%;padding:10px 6px 6px}
.pal.on{border-color:var(--accent);background:var(--accent-soft)}
.strip{min-height:96px;border:2px dashed var(--rule);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}
.strip:empty::before{content:attr(data-empty);color:var(--dim);font-size:14px;padding:0 6px}
.feedback{margin-top:16px;padding:14px;border-radius:12px;background:var(--panel-2)}
.feedback.good{background:var(--ok-soft)} .feedback.wrong{background:var(--bad-soft)}
.feedback h3{font-size:17px;margin-bottom:4px}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:16px}
/* I kortet sitter knapparna i en list som fastnar i skärmens nederkant när kortet är längre än
   skärmen (mobil): "Fortsätt"/"Kontrollera" nås alltid utan att bläddra. Ryms allt ligger den
   kvar på sin plats. Efter svaret visar listen också resultatet. */
#card .actions{position:sticky;bottom:0;z-index:5;margin:16px -20px -20px;
  padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border-top:1px solid var(--rule);border-radius:0 0 14px 14px}
#card .actions.result{justify-content:space-between}
#card .actions.good{background:var(--ok-soft);border-top-color:var(--ok)}
#card .actions.wrong{background:var(--bad-soft);border-top-color:var(--bad)}
.verdict{font-weight:700;font-size:18px}
.actions.good .verdict{color:var(--ok)} .actions.wrong .verdict{color:var(--bad)}
.hint{font-size:12px;color:var(--dim);text-align:right;margin-top:6px}
#card .actions .hint{margin:0 auto 0 0;text-align:left}
#card .actions.result .hint{margin:0 0 0 12px}
#card .actions.result .verdict{margin-right:auto}
@media (hover:none),(max-width:520px){.hint{display:none}}   /* tangentbordstips: inte på pekskärm eller smal skärm */

/* ordlista */
.search{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--panel-2);color:var(--ink);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.grid .chip{max-width:none;width:100%}
.dots{display:flex;gap:2px;justify-content:center;margin-top:2px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--rule)}
.dots i.f{background:var(--accent)}
dialog{margin:auto;border:0;border-radius:16px;padding:22px;max-width:min(640px,calc(100vw - 32px));width:100%;background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.close{float:right;background:none;border:0;font-size:22px;line-height:1;color:var(--dim)}
/* kylskåpspoesi */
.fridge{position:relative;border-radius:18px;padding:18px 26px 18px 16px;
  background:linear-gradient(165deg,#FBFBF9 0%,#ECEDE9 55%,#E2E3DE 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 6px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.08)}
.fridge::after{content:"";position:absolute;right:9px;top:22px;width:7px;height:120px;border-radius:4px;
  background:linear-gradient(90deg,#C9CAC5,#F4F4F1 45%,#B9BAB4);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.poem{min-height:150px;display:flex;flex-wrap:wrap;align-content:flex-start;align-items:flex-start;gap:12px 8px;
  padding:10px;border-radius:12px;border:2px dashed transparent;transition:border-color .15s,background .15s}
.poem.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.poem-empty{color:#8A8A86;font-size:15px;align-self:center;margin:auto;text-align:center;pointer-events:none}
.pile{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px;margin-top:14px;padding-top:16px;border-top:1px solid rgba(0,0,0,.07)}
.magnet{--rot:0deg;--dy:0px;display:inline-flex;flex-direction:column;align-items:center;gap:0;min-width:58px;
  padding:5px 8px 4px;border:0;border-radius:3px;background:#FFFFFF;color:#1B1B1D;
  box-shadow:0 1px 0 rgba(0,0,0,.06),0 2px 5px rgba(0,0,0,.16);transform:translateY(var(--dy)) rotate(var(--rot));
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;transition:transform .12s,box-shadow .12s}
.magnet .sym{color:#1B1B1D;pointer-events:none}
.magnet span{font-size:14px;line-height:1.15;margin-top:-3px;pointer-events:none;max-width:120px;overflow-wrap:anywhere}
.magnet:hover{transform:translateY(calc(var(--dy) - 2px)) rotate(var(--rot));box-shadow:0 1px 0 rgba(0,0,0,.06),0 5px 10px rgba(0,0,0,.18)}
.magnet.lifted{opacity:.18}
.magnet.landing{visibility:hidden}
.magnet.fresh{animation:mag-drop .34s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i,0) * 28ms)}

.mag-ghost{position:fixed;left:0;top:0;margin:0;z-index:100;pointer-events:none;cursor:grabbing;
  box-shadow:0 3px 0 rgba(0,0,0,.05),0 14px 26px rgba(0,0,0,.28);will-change:transform}
@keyframes mag-drop{from{opacity:0;transform:translateY(calc(var(--dy) - 14px)) rotate(calc(var(--rot) * 3)) scale(.85)}}
@keyframes mag-settle{0%{transform:translateY(var(--dy)) rotate(calc(var(--rot) * -1.6))}55%{transform:translateY(var(--dy)) rotate(calc(var(--rot) * 1.4))}100%{transform:translateY(var(--dy)) rotate(var(--rot))}}
.fridge.done .poem{min-height:0;justify-content:center;gap:16px 10px;padding:22px 6px}
.fridge.done .magnet{cursor:pointer}
.poem-actions{margin-top:14px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fridge{background:linear-gradient(165deg,#3A3D42 0%,#2E3035 60%,#272A2E 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 2px rgba(0,0,0,.4)}

:root[data-theme="dark"] .fridge::after{background:linear-gradient(90deg,#4A4D52,#7A7D82 45%,#3E4146)}
:root[data-theme="dark"] .pile{border-top-color:rgba(255,255,255,.08)}

@media (max-width:520px){

}

<body>
<div class="statusbar" aria-hidden="true"></div>
<header>
  <h1 id="app-title">Bliss-glosor</h1>
  <nav>
    <button type="button" data-view="home" aria-current="true">Översikt</button>
    <button type="button" data-view="list">Ordlista</button>
    <button type="button" data-view="about">Om</button>
  </nav>
  <button type="button" class="lang-toggle" id="lang-toggle" lang="en" aria-label="Switch to English">EN</button>
</header>
<main id="app"></main>
<dialog id="detail"></dialog>

<script src="src/vendor/bliss-shapes.js"></script>
<script src="src/vendor/bliss-engine.js"></script>
<script src="src/vendor/bliss-data.js"></script>
<script>
  // bliss-data.js deklarerar `const BLISS_DATA` i skript-scopet — src/glosor.js läser den från window.
  window.BLISS_DATA = BLISS_DATA;
</script>
<script src="src/vendor/bliss-derivations.js"></script>
<script src="src/vendor/bliss-meningar.js"></script>
<script src="src/glosor.js"></script>
<script>
// Vanliga skript, inga ES-moduler: då fungerar sidan även när den öppnas direkt
// från disken (file://), där webbläsare blockerar moduler.
(() => {
const {
  S, save, resetProgress, stats, nextStep, grade, checkParts, fmtInterval, boxOf, card, deck,
  symbolSVG, chip, classChip, formulaHTML, mergedNote, esc, MODES, nextAtom,
  isMine, mineCards, toggleMine, startFocus, endFocus, focusState, reviewCount, nextDue,
  exportBackup, readBackup, importBackup,
  sentenceCount, sentenceTotal, startSentences, endSentences, sentenceState, nextSentence, answerSentence, wordSVG, sentenceDrafts,
  milestoneState, checkMilestones, rankOf, lang, setLang, poemOptions, poemLabel,
} = window.Glosor;
/** Text på valt språk: tx('svenska', 'English'). */
const tx = (sv, en) => (lang() === 'en' ? en : sv);
const fmtN = (n) => n.toLocaleString(lang() === 'en' ? 'en-GB' : 'sv-SE');
/** Avsluta Mina ord- och meningspass (vid byte av vy). */
const endModes = () => { endFocus(); endSentences(); };

const app = document.getElementById('app');
const dlg = document.getElementById('detail');
let view = 'home';
let step = null, answered = false, sess = null;

// ---------------------------------------------------------------- översikt
function home() {
  const st = stats();
  const atom = nextAtom();
  const pct = (a, b) => (b ? (100 * a / b).toFixed(1) : 0);
  const modes = Object.entries(MODES).map(([k, label]) =>
    `<label><input type="checkbox" data-mode="${k}" ${S.settings.modes[k] ? 'checked' : ''}> ${label}</label>`).join('');
  const work = st.due + st.newLeft;
  const learnt = reviewCount(), wait = nextDue();
  app.innerHTML = `
    <section class="panel">
      ${work ? `<p class="small muted" style="margin-bottom:8px">${tx(`${st.due} att repetera nu · ${st.newLeft} nya kvar i dag`, `${st.due} to review now · ${st.newLeft} new left today`)}</p>` : ''}
      ${!work && learnt ? `<p class="small muted" style="margin-bottom:8px">${tx('Klart för i dag!', 'Done for today!')}${wait != null ? tx(` Nästa repetition ${fmtInterval(wait)}.`, ` Next review ${fmtInterval(wait)}.`) : ''}</p>` : ''}
      <div class="row">
        ${work ? `<button type="button" class="primary" id="start">${tx('Börja öva', 'Start practising')}</button>`
          : `<button type="button" class="primary" id="review" ${learnt ? '' : 'disabled'}>${tx('Repetera det du lärt dig', 'Review what you have learned')}</button>`}
        ${work && learnt ? `<button type="button" class="ghost" id="review">${tx('Repetera fritt', 'Free review')}</button>` : ''}
        ${work ? '' : `<button type="button" class="ghost" id="more">${tx('Lär 5 nya till', 'Learn 5 more')}</button>`}
        ${atom ? `<span class="small muted">${tx('Nästa grundtecken:', 'Next basic character:')}</span>${chip(atom, 2.6)}` : ''}
      </div>
    </section>
    ${minePanel()}
    ${sentencesPanel()}
    ${poemPanel()}
    <section class="panel">
      ${milestoneHTML()}
      <div class="stats">
        <div class="stat"><b>${st.due}</b><span>${tx('att repetera nu', 'to review now')}</span></div>
        <div class="stat"><b>${st.newLeft}</b><span>${tx('nya kvar i dag', 'new left today')}</span></div>
        <div class="stat"><b>${st.learned}</b><span>${tx('lärda', 'learned')}</span></div>
        <div class="stat"><b>${st.unlocked}</b><span>${tx('sammansatta ord upplåsta', 'compound words unlocked')}</span></div>
      </div>
      <div class="small muted">${tx(`Grundtecken: ${st.atoms} av ${st.atomTotal}`, `Basic characters: ${st.atoms} of ${st.atomTotal}`)}</div>
      <div class="bar"><i style="width:${pct(st.atoms, st.atomTotal)}%"></i></div>
      <div class="small muted">${tx(`Sammansatta ord: ${st.compounds} av ${st.compoundTotal}`, `Compound words: ${st.compounds} of ${st.compoundTotal}`)}</div>
      <div class="bar"><i style="width:${pct(st.compounds, st.compoundTotal)}%"></i></div>
    </section>
    <section class="panel settings">
      <h2>${tx('Inställningar', 'Settings')}</h2>
      <fieldset><legend>${tx('Språk', 'Language')}</legend>
        <label><input type="radio" name="lang" value="sv" ${lang() === 'sv' ? 'checked' : ''}> Svenska</label>
        <label><input type="radio" name="lang" value="en" ${lang() === 'en' ? 'checked' : ''}> English</label>
      </fieldset>
      <fieldset><legend>${tx('Övningar', 'Exercises')}</legend>${modes}</fieldset>
      <fieldset><legend>${tx('Takt', 'Pace')}</legend>
        <label>${tx('Nya symboler per dag', 'New symbols per day')} <input type="number" id="npd" min="1" max="100" value="${S.settings.newPerDay}"></label>
        <label><input type="checkbox" id="staff" ${S.settings.staff ? 'checked' : ''}> ${tx('Visa himmels- och jordlinje', 'Show sky and earth lines')}</label>
      </fieldset>
      <fieldset class="backup"><legend>${tx('Säkerhetskopia', 'Backup')}</legend>
        <p class="small muted">${tx('Framstegen finns bara på den här enheten (på iPhone raderas de med appen). Spara en kopia då och då.',
          'Progress is stored only on this device (on iPhone it is deleted with the app). Save a copy now and then.')}</p>
        <div class="row">
          <button type="button" class="ghost" id="backup-save">${tx('Spara säkerhetskopia', 'Save backup')}</button>
          <button type="button" class="ghost" id="backup-load">${tx('Läs in säkerhetskopia', 'Load backup')}</button>
          <input type="file" id="backup-file" accept=".json,application/json" hidden>
        </div>
        <div class="backup-msg small" id="backupmsg" role="status"></div>
      </fieldset>
      <p class="small muted">${tx('Grundtecknen kommer först. Ett sammansatt ord låses upp när du kan dess delar. Rätt svar ger längre intervall (10 min → 1 dag → … → 90 dagar), fel svar börjar om.',
        'Basic characters come first. A compound word unlocks when you know its parts. Right answers give longer intervals (10 min → 1 day → … → 90 days); a wrong answer starts over.')}</p>
      <div style="margin-top:10px" id="resetbox"><button type="button" class="danger" id="reset">${tx('Nollställ framsteg', 'Reset progress')}</button></div>
    </section>`;
}

function minePanel() {
  const mine = mineCards();
  return `<section class="panel">
      <div class="head"><h2>${tx('Mina ord', 'My words')}</h2>
        <button type="button" class="primary" id="focus" ${mine.length ? '' : 'disabled'}>${tx('Öva mina ord', 'Practise my words')}${mine.length ? ` (${mine.length})` : ''}</button></div>
      ${mine.length
        ? `<p class="small muted">${tx('Ord du valt att träna extra. Klicka på ett ord för att ta bort det.', 'Words you chose to practise extra. Click a word to remove it.')}</p>
           <div class="formula">${mine.map((c) => chip(c, 2.6)).join('')}</div>`
        : `<p class="small muted">${tx('Inga ord än. Välj ☆ på ett ord i <button type="button" class="linklike" id="go-list">Ordlista</button>.',
           'No words yet. Choose ☆ on a word in the <button type="button" class="linklike" id="go-list">Word list</button>.')}</p>`}
    </section>`;
}

/** Milstolpar: lärda ord och lärda grundtecken, var för sig med statusbar och märken. */
const MS_UNIT_T = { words: ['lärda ord', 'learned words'], atoms: ['lärda grundtecken', 'learned basic characters'] };
const MS_TITLE_T = { words: ['Ord', 'Words'], atoms: ['Grundtecken', 'Basic characters'] };
const MS_UNIT = { get words() { return tx(...MS_UNIT_T.words); }, get atoms() { return tx(...MS_UNIT_T.atoms); } };
const MS_TITLE = { get words() { return tx(...MS_TITLE_T.words); }, get atoms() { return tx(...MS_TITLE_T.atoms); } };
/** En titel: Blissymbolen (ur BCI-AV) och namnet. */
function rankHTML(r, unit = 3.4) {
  if (!r) return '';
  const c = card(r.id);
  return `<span class="rank">${c ? symbolSVG(c, unit) : ''}<span class="rank-name">${esc(r.name)}</span></span>`;
}
function milestoneTrackHTML(track) {
  const m = milestoneState(track);
  const fmt = fmtN;
  if (!m.next) {
    return `<div class="ms-track"><div class="ms-top"><span class="ms-title">${MS_TITLE[track]}</span>
      <span class="ms-count">${tx(`Alla ${fmt(m.total)} ${MS_UNIT[track]} – grattis!`, `All ${fmt(m.total)} ${MS_UNIT[track]} – congratulations!`)}</span></div>
      <div class="ms-ranks"><div class="ms-rank"><span class="ms-lbl">${tx('Du är', 'You are')}</span>${rankHTML(m.rankNow)}</div></div></div>`;
  }
  const pct = Math.min(100, (100 * m.learned) / m.next);
  const i = m.steps.indexOf(m.next);
  const chips = m.steps.slice(Math.max(0, i - 3), i + 3)
    .map((n) => `<span class="ms-chip${n <= m.prev ? ' done' : n === m.next ? ' next' : ''}" title="${esc(rankOf(track, n)?.name || '')}">${n === m.total ? tx('alla ', 'all ') : ''}${fmt(n)}</span>`).join('');
  return `<div class="ms-track">
      <div class="ms-top"><span class="ms-title">${MS_TITLE[track]}</span>
        <span class="ms-count"><b>${fmt(m.learned)}</b> ${tx('av', 'of')} ${fmt(m.next)} ${MS_UNIT[track]}</span></div>
      <div class="ms-ranks">
        <div class="ms-rank"><span class="ms-lbl">${tx('Du är', 'You are')}</span>${m.rankNow ? rankHTML(m.rankNow) : `<span class="rank-name muted">${tx('på väg', 'on your way')}</span>`}</div>
        <span class="ms-arrow" aria-hidden="true">→</span>
        <div class="ms-rank next"><span class="ms-lbl">${tx('Nästa vid', 'Next at')} ${fmt(m.next)}</span>${rankHTML(m.rankNext)}</div>
      </div>
      <div class="ms-bar" role="progressbar" aria-label="${MS_TITLE[track]}: ${MS_UNIT[track]} ${tx('mot nästa milstolpe', 'towards the next milestone')}" aria-valuemin="0" aria-valuemax="${m.next}" aria-valuenow="${m.learned}"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="ms-chips">${chips}</div>
    </div>`;
}
function milestoneHTML() {
  return `<div class="milestone">
      <span class="kicker">${tx('Nästa milstolpe', 'Next milestone')}</span>
      ${milestoneTrackHTML('words')}
      ${milestoneTrackHTML('atoms')}
      <p class="ms-note">${tx('Lärt = rätt igen efter minst ett dygn.', 'Learned = right again after at least a day.')}</p>
    </div>`;
}

function sentencesPanel() {
  const n = sentenceCount(), total = sentenceTotal();
  if (!total) return '';   // syns först när det finns godkända meningar
  const more = n < total
    ? tx(` ${n} av ${total} upplåsta.`, ` ${n} of ${total} unlocked.`)
    : '';
  return `<section class="panel">
      <div class="head"><h2>${tx('Meningar', 'Sentences')}</h2>
        <button type="button" class="primary" id="sentences" ${n ? '' : 'disabled'}>${tx('Öva meningar', 'Practise sentences')}${n ? ` (${n})` : ''}</button></div>
      <p class="small muted">${tx('Välj ordet som saknas.', 'Choose the missing word.')}${more}${sentenceDrafts ? tx(' <b>Utkast visas</b> (granskningsläge).', ' <b>Drafts shown</b> (review mode).') : ''}</p>
    </section>`;
}

// ---------------------------------------------------------------- kylskåpspoesi
// Dikten ligger kvar så länge appen är öppen (inte sparad). Varje magnet får en egen lutning,
// som följer med när den flyttas – så ser kylskåpsdörren lagom stökig ut.
const poem = { words: [], opts: null, hist: [], done: false, seq: 0 };
const jitter = () => ({ rot: +(Math.random() * 8 - 4).toFixed(1), dy: Math.round(Math.random() * 8 - 4) });
function newOpts(chosenId = null) {
  const old = new Map((poem.opts || []).map((o) => [o.id, o]));
  poem.opts = poemOptions(chosenId, chosenId == null ? [] : poem.opts || [])
    .map((o) => (o.kept && old.has(o.id) ? { ...old.get(o.id), kept: true, fresh: false } : { ...o, ...jitter(), fresh: true }));
}

function poemPanel() {
  return `<section class="panel">
      <div class="head"><h2>${tx('Kylskåpspoesi', 'Fridge poetry')}</h2>
        <button type="button" class="primary" id="poem-open">${tx('Börja dikta', 'Start writing')}</button></div>
      <p class="small muted">${tx('Bygg fria dikter med ordmagneter.', 'Build free poems with word magnets.')}</p>
    </section>`;
}

const magnetHTML = (c, m, attrs, i = 0) =>
  `<button type="button" class="magnet${m.fresh ? ' fresh' : ''}" ${attrs} style="--rot:${m.rot}deg;--dy:${m.dy}px;--i:${i}">${symbolSVG(c, 3.4)}<span>${esc(poemLabel(c))}</span></button>`;

function poesi() {
  if (!poem.opts) newOpts();
  const words = poem.words.map((w, i) => magnetHTML(card(w.id), w, `data-placed="${i}" data-key="${w.key}"`)).join('');
  const opts = poem.opts.map((o, i) => magnetHTML(card(o.id), o, `data-mag="${o.id}"`, i)).join('');
  app.innerHTML = `
    <section class="panel">
      <div class="head"><h2>${tx('Kylskåpspoesi', 'Fridge poetry')}</h2>
        <button type="button" class="ghost" data-act="home">${tx('← Översikt', '← Overview')}</button></div>
      <p class="small muted" style="margin-bottom:12px">${poem.done
        ? tx('Tryck på ett ord för att se symbolen.', 'Tap a word to see the symbol.')
        : tx('Dra eller tryck på en magnet. Dra ut den för att ta bort.', 'Drag or tap a magnet. Drag it out to remove it.')}</p>
      <div class="fridge${poem.done ? ' done' : ''}">
        <div class="poem" id="poem">${words || `<p class="poem-empty">${tx('Dra hit ditt första ord', 'Drag your first word here')}</p>`}</div>
        ${poem.done ? '' : `<div class="pile" id="pile">${opts}</div>`}
      </div>
      <div class="row poem-actions">${poem.done
        ? `<button type="button" class="primary" id="poem-clear">${tx('Rensa och skriv en ny', 'Clear and write a new one')}</button>
           <button type="button" class="ghost" id="poem-edit">${tx('Skriv vidare', 'Keep writing')}</button>`
        : `<button type="button" class="primary" id="poem-done" ${poem.words.length ? '' : 'disabled'}>${tx('Färdig', 'Done')}</button>
           <button type="button" class="ghost" id="poem-undo" ${poem.hist.length ? '' : 'disabled'}>${tx('↶ Ångra', '↶ Undo')}</button>
           <button type="button" class="ghost" id="poem-shuffle">${tx('Nya ord', 'New words')}</button>`}</div>
    </section>`;
  for (const o of poem.opts) o.fresh = false;
  for (const w of poem.words) w.fresh = false;
}

/** Lägg ett ord i dikten (på plats at) och ta fram nästa omgång magneter. Returnerar magnetens nyckel. */
function placeWord(id, at = poem.words.length) {
  const key = ++poem.seq;
  poem.hist.push({ key, opts: poem.opts });
  poem.words.splice(at, 0, { id, key, ...jitter() });
  newOpts(id);
  return key;
}
function removeWord(i) {
  poem.words.splice(i, 1);
  if (!poem.words.length) { poem.hist = []; newOpts(); }   // tom dörr: börja om med helt slumpade ord
}
function undoWord() {
  const h = poem.hist.pop();
  if (!h) return;
  const i = poem.words.findIndex((w) => w.key === h.key);
  if (i >= 0) poem.words.splice(i, 1);
  poem.opts = h.opts.map((o) => ({ ...o, fresh: false }));
}

/** Var i dikten en magnet släpps: före första magneten som ligger efter punkten i läsordning. */
function insertIndex(x, y, skip = -1) {
  let i = 0;
  for (const el of document.querySelectorAll('#poem .magnet')) {
    if (+el.dataset.placed === skip) continue;
    const r = el.getBoundingClientRect();
    if (y < r.top || (y <= r.bottom && x < r.left + r.width / 2)) return i;
    i++;
  }
  return i;
}

// En lös kopia av magneten följer fingret och lutar åt det håll den dras.
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function makeGhost(el) {
  const r = el.getBoundingClientRect();
  const g = el.cloneNode(true);
  g.classList.remove('fresh', 'settle', 'lifted');
  g.classList.add('mag-ghost');
  g.removeAttribute('data-mag'); g.removeAttribute('data-placed');
  Object.assign(g.style, { width: r.width + 'px', height: r.height + 'px' });
  document.body.appendChild(g);
  return { g, x: r.left, y: r.top, rot: parseFloat(el.style.getPropertyValue('--rot')) || 0, tilt: 0 };
}
const ghostAt = (gh, x, y, rot, scale = 1.08) => { gh.g.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${scale})`; };
/** Låt kopian glida till sin plats (eller tillbaka) och ta sedan bort den. */
function glide(gh, x, y, rot, done, fall = false) {
  const ms = reduceMotion.matches ? 0 : fall ? 260 : 220;
  gh.g.style.transition = `transform ${ms}ms cubic-bezier(.2,.9,.3,1.15), opacity ${ms}ms`;
  requestAnimationFrame(() => {
    ghostAt(gh, x, y, rot, fall ? 0.7 : 1);
    if (fall) gh.g.style.opacity = '0';
  });
  setTimeout(() => { gh.g.remove(); done?.(); }, ms + 20);
}
/** Efter omritning: den nya magneten i dikten tar över där kopian landar. */
function landOn(gh, key) {
  const el = document.querySelector(`#poem [data-key="${key}"]`);
  if (!el) { gh.g.remove(); return; }
  el.classList.add('landing');
  const r = el.getBoundingClientRect();
  glide(gh, r.left, r.top, parseFloat(el.style.getPropertyValue('--rot')) || 0, () => {
    el.classList.remove('landing');
    el.classList.add('settle');
  });
}

let drag = null, suppressClick = false;
app.addEventListener('pointerdown', (e) => {
  if (view !== 'poesi' || poem.done || drag || e.button > 0) return;
  const el = e.target.closest('.magnet');
  if (el) drag = { el, pid: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, gh: null };
});
window.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.pid) return;
  if (!drag.gh) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.gh = makeGhost(drag.el);
    drag.ox = drag.x0 - drag.gh.x; drag.oy = drag.y0 - drag.gh.y;
    drag.el.classList.add('lifted');
  }
  e.preventDefault();
  const gh = drag.gh;
  gh.tilt = Math.max(-16, Math.min(16, gh.tilt * 0.75 + (e.clientX - drag.lx) * 0.9));
  drag.lx = e.clientX;
  ghostAt(gh, e.clientX - drag.ox, e.clientY - drag.oy, gh.rot + gh.tilt);
  const pr = document.getElementById('poem').getBoundingClientRect();
  drag.over = e.clientX >= pr.left && e.clientX <= pr.right && e.clientY >= pr.top - 10 && e.clientY <= pr.bottom + 10;
  document.getElementById('poem').classList.toggle('over', drag.over);
  // nära skärmkanten: bläddra med, så att dikten nås även när magneterna ligger långt ner
  if (e.clientY < 70) window.scrollBy(0, -14);
  else if (e.clientY > innerHeight - 70) window.scrollBy(0, 14);
}, { passive: false });
function endDrag(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const { el, gh, over } = drag;
  drag = null;
  if (!gh) return;   // ingen förflyttning: ett vanligt tryck, som klickhanteraren tar
  suppressClick = true;
  setTimeout(() => { suppressClick = false; }, 60);
  const placed = el.dataset.placed != null ? +el.dataset.placed : -1;
  if (e.type === 'pointercancel' || (!over && placed < 0)) {
    // tillbaka till högen
    const r = el.getBoundingClientRect();
    return glide(gh, r.left, r.top, gh.rot, () => el.classList.remove('lifted'));
  }
  if (!over) {
    // dragen ur dikten: magneten faller bort
    removeWord(placed);
    poesi();
    return glide(gh, gh.x, innerHeight + 40, gh.rot + 40, null, true);
  }
  const at = insertIndex(e.clientX, e.clientY, placed);
  let key;
  if (placed >= 0) {
    const [w] = poem.words.splice(placed, 1);
    poem.words.splice(at, 0, w);
    key = w.key;
  } else key = placeWord(+el.dataset.mag, at);
  poesi();
  landOn(gh, key);
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);
app.addEventListener('click', (e) => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

/** Tryck på en magnet i högen: den flyger upp sist i dikten. */
function tapMagnet(el) {
  const gh = makeGhost(el);
  ghostAt(gh, gh.x, gh.y, gh.rot, 1);
  const key = placeWord(+el.dataset.mag);
  poesi();
  landOn(gh, key);
}

// ---------------------------------------------------------------- pass
/** kind: undefined = vanligt pass, 'mine' = Mina ord, 'sentences' = meningar. */
function startSession(kind) {
  endModes();
  if (kind === 'mine' || kind === 'review') startFocus(kind);
  if (kind === 'sentences') startSentences();
  sess = { right: 0, wrong: 0, fresh: 0, mine: kind === 'mine', review: kind === 'review', sentences: kind === 'sentences' };
  setView('session');
  advance();
}

function advance() {
  step = sess.sentences ? nextSentence() : nextStep();
  answered = false;
  if (step?.kind === 'intro') sess.fresh++;
  renderStep();
  window.scrollTo(0, 0);   // nästa kort börjar överst, även om man bläddrat ner i förra
}

function progressBar() {
  const st = stats(), f = focusState(), m = sentenceState();
  const left = m ? tx(`Meningar · ${m.left} av ${m.total} kvar`, `Sentences · ${m.left} of ${m.total} left`)
    : f?.review ? tx(`Repetition · ${f.left} av ${f.total} kvar`, `Review · ${f.left} of ${f.total} left`)
    : f ? tx(`Mina ord · ${f.left} av ${f.total} kvar`, `My words · ${f.left} of ${f.total} left`)
      : tx(`${st.due} att repetera · ${st.newLeft} nya kvar`, `${st.due} to review · ${st.newLeft} new left`);
  return `<div class="progress"><span>${left}</span>
    <span>${sess.right} ${tx('rätt', 'right')} · ${sess.wrong} ${tx('fel', 'wrong')} <button type="button" class="ghost" id="quit" style="padding:4px 10px;margin-left:8px">${tx('Avsluta', 'Quit')}</button></span></div>`;
}

function introHTML(c) {
  const kind = c.parts.length ? tx('Nytt ord', 'New word') : tx('Nytt grundtecken', 'New basic character');
  const users = c.users.length ? `<p class="small muted" style="margin-top:8px">${tx(`Ingår i ${c.users.length} andra ord.`, `Part of ${c.users.length} other words.`)}</p>` : '';
  return `<div class="kicker">${kind}</div>
    <div class="stage">${symbolSVG(c, 9)}</div>
    <div class="word">${esc(c.word)}</div>

/** "Markera alla delar …" – säger till när samma del förekommer flera gånger (arbete = aktivitet + aktivitet). */
function partsCountText(c) {
  const distinct = new Set(c.parts).size, total = c.parts.length;
  if (c.optInd) {
    const n = `${distinct - c.optInd.length}–${distinct}`;
    return tx(`Markera delarna (${n} st, operatorn valfri).`, `Select the parts (${n}, indicator optional).`);
  }
  if (total > distinct) {
    return tx(`Markera delarna (${distinct} ${distinct === 1 ? 'del' : 'olika'} – någon finns flera gånger).`,
      `Select the parts (${distinct} ${distinct === 1 ? 'part' : 'different'} – one appears more than once).`);
  }
  return tx(`Markera delarna (${distinct} st).`, `Select the parts (${distinct}).`);
}

      <div class="opts">${step.options.map((o, i) => `<button type="button" class="opt" data-opt="${i}"><span class="k">${i + 1}</span>${esc(o.word)}</button>`).join('')}</div>
      <div class="hint">${tx('Tangent 1–4 väljer', 'Keys 1–4 choose')}</div>`;
  }
  if (mode === 'word') {
    return `<div class="kicker">${MODES.word}</div><p class="prompt">${tx('Vilken symbol betyder', 'Which symbol means')}</p>

      <div class="opts">${step.options.map((o, i) => `<button type="button" class="opt" data-opt="${i}" aria-label="${tx('Alternativ', 'Option')} ${i + 1}"><span class="k">${i + 1}</span>${symbolSVG(o, 4.5)}</button>`).join('')}</div>

  if (mode === 'parts') {
    return `<div class="kicker">${MODES.parts}</div><p class="prompt">${tx(`Vilka delar består <b>${esc(c.word)}</b> av?`, `Which parts is <b>${esc(c.word)}</b> made of?`)}</p>
      <div class="stage">${symbolSVG(c, 9)}</div>

  }

    <div class="word">${esc(c.word)}</div><div style="margin-top:4px">${classChip(c)}</div>
    <div class="strip" id="strip" data-empty="${tx('Välj delar nedan', 'Choose parts below')}">${step.sel.map((id, i) => `<button type="button" class="chip" data-unsel="${i}" title="${tx('Ta bort', 'Remove')}">${symbolSVG(card(id), 3.4)}<span>${esc(card(id).word)}</span></button>`).join('')}</div>
    <p class="small muted" style="margin-top:6px">${c.optInd ? tx(`${c.parts.length} delar (operatorn valfri).`, `${c.parts.length} parts (indicator optional).`) : tx(`${c.parts.length} delar.`, `${c.parts.length} parts.`)}</p>
    <div class="palette">${pal}</div>
    <div class="actions"><span class="hint">${tx('Siffror lägger till · Backsteg tar bort · Enter kontrollerar', 'Numbers add · Backspace removes · Enter checks')}</span><button type="button" class="ghost" data-act="clear">${tx('Rensa', 'Clear')}</button><button type="button" class="primary" data-act="check">${tx('Kontrollera', 'Check')}</button></div>`;
}

/** Meningen i Bliss; luckan som streckad ruta (eller ifylld efter svaret). */
function sentenceRow(m, filled = false, glossed = false) {
  return `<div class="sentence${glossed ? ' glossed' : ''}">${m.ord.map((w, i) => {
    if (i === m.lucka && !filled) return `<span class="blank" aria-label="${tx('ordet som saknas', 'the missing word')}">?</span>`;
    const svg = wordSVG(`${m.nr}-${i}`, w.e, glossed ? 4.6 : 6.4);
    return `<figure class="sw${i === m.lucka ? ' hit' : ''}">${svg}${glossed ? `<figcaption>${esc(tx(w.sv, w.en || w.sv))}</figcaption>` : ''}</figure>`;
  }).join('')}</div>`;
}

function sentenceHTML() {
  const { m } = step;
  return `<div class="kicker">${tx('Färdigställ meningen', 'Complete the sentence')}</div><p class="prompt">${tx('Vilket ord saknas?', 'Which word is missing?')}</p>
    ${sentenceRow(m)}
    <div class="opts">${step.options.map((o, i) => `<button type="button" class="opt" data-opt="${i}" aria-label="${tx('Alternativ', 'Option')} ${i + 1}"><span class="k">${i + 1}</span>${wordSVG(`${m.nr}-a${o.id}`, o.e, 4.5)}</button>`).join('')}</div>
    <div class="hint">${tx('Tangent 1–4 väljer', 'Keys 1–4 choose')}</div>`;
}

function sentenceFeedbackHTML(ok, note) {
  const { m } = step;
  return `<div class="feedback ${ok ? 'good' : 'wrong'}">
    <h3>${ok ? tx('Rätt!', 'Correct!') : tx('Inte riktigt', 'Not quite')}</h3>
    <p class="word" style="font-size:20px">${esc(tx(m.sv, m.en || m.sv))}</p>
    ${note ? `<p class="small" style="margin-top:4px">${note}</p>` : ''}
    ${sentenceRow(m, true, true)}
  </div>
  <div class="actions result ${ok ? 'good' : 'wrong'}"><span class="verdict" aria-hidden="true">${ok ? tx('Rätt!', 'Correct!') : tx('Inte riktigt', 'Not quite')}</span>
    <span class="hint">${tx('Enter = fortsätt', 'Enter = continue')}</span><button type="button" class="primary" data-act="next">${tx('Fortsätt →', 'Continue →')}</button></div>`;

  if (!step && sess.sentences) {
    const tot = sentenceState()?.total ?? '';
    app.innerHTML = `<section class="panel"><div class="kicker">${tx('Meningar – klart', 'Sentences – done')}</div>
      <p class="prompt">${tx(`Du har färdigställt alla ${tot} meningar${sess.wrong ? `, efter ${sess.wrong} fel på vägen` : ' direkt'}.`,
        `You have completed all ${tot} sentences${sess.wrong ? `, after ${sess.wrong} mistakes along the way` : ' straight away'}.`)}</p>
      <div class="actions"><button type="button" class="ghost" data-act="home">${tx('Till översikten', 'Back to overview')}</button><button type="button" class="primary" data-act="sentences">${tx('Öva meningarna igen', 'Practise the sentences again')}</button></div></section>`;
    return;
  }
  if (!step && sess.review) {
    const tot = focusState()?.total ?? '';
    app.innerHTML = `<section class="panel"><div class="kicker">${tx('Repetition – klart', 'Review – done')}</div>
      <p class="prompt">${tx(`Du har svarat rätt på alla ${tot} ord${sess.wrong ? `, efter ${sess.wrong} fel på vägen` : ' direkt'}.`,
        `You have answered all ${tot} words correctly${sess.wrong ? `, after ${sess.wrong} mistakes along the way` : ' straight away'}.`)}</p>
      <p class="muted">${tx('Fri repetition flyttar inte orden i schemat.', 'Free review does not move words in the schedule.')}</p>
      ${milestoneHTML()}
      <div class="actions"><button type="button" class="ghost" data-act="home">${tx('Till översikten', 'Back to overview')}</button><button type="button" class="primary" data-act="review">${tx('Repetera fler', 'Review more')}</button></div></section>`;
    return;
  }
  if (!step && sess.mine) {
    const tot = focusState()?.total ?? '';
    app.innerHTML = `<section class="panel"><div class="kicker">${tx('Mina ord – klart', 'My words – done')}</div>
      <p class="prompt">${tx(`Du har svarat rätt på alla ${tot} ord${sess.wrong ? `, efter ${sess.wrong} fel på vägen` : ' direkt'}.`,
        `You have answered all ${tot} words correctly${sess.wrong ? `, after ${sess.wrong} mistakes along the way` : ' straight away'}.`)}</p>
      <div class="actions"><button type="button" class="ghost" data-act="home">${tx('Till översikten', 'Back to overview')}</button><button type="button" class="primary" data-act="focus">${tx('Öva mina ord igen', 'Practise my words again')}</button></div></section>`;
    return;
  }
  if (!step) {
    const st = stats();
    const n = sess.right + sess.wrong;
    app.innerHTML = `<section class="panel"><div class="kicker">${tx('Klart', 'Done')}</div>
      <p class="prompt">${n ? tx(`Du svarade rätt på ${sess.right} av ${n}`, `You answered ${sess.right} of ${n} correctly`) : tx('Inget kvar att öva just nu', 'Nothing left to practise right now')}${sess.fresh ? tx(` och lärde dig ${sess.fresh} nya symboler`, ` and learned ${sess.fresh} new symbols`) : ''}.</p>
      <p class="muted">${st.unlocked ? tx(`${st.unlocked} sammansatta ord är upplåsta och väntar.`, `${st.unlocked} compound words are unlocked and waiting.`) : ''}</p>
      ${milestoneHTML()}
      <div class="actions"><button type="button" class="ghost" data-act="home">${tx('Till översikten', 'Back to overview')}</button><button type="button" class="primary" data-act="more">${tx('Lär 5 nya till', 'Learn 5 more')}</button></div></section>`;
    return;
  }
  const body = step.kind === 'intro' ? introHTML(step.c) : step.kind === 'sentence' ? sentenceHTML() : quizHTML();
  app.innerHTML = progressBar() + `<section class="panel" id="card">${body}</section>`;
}

function feedbackHTML(ok, ms, note = '') {
  const { c } = step;
  return `<div class="feedback ${ok ? 'good' : 'wrong'}">
    <h3>${ok ? tx('Rätt!', 'Correct!') : tx('Inte riktigt', 'Not quite')}</h3>
    <div class="row" style="align-items:flex-end">${step.mode === 'sym' ? '' : symbolSVG(c, 5)}<div><div class="word" style="font-size:22px">${esc(c.word)}</div>${classChip(c)}</div></div>
    ${note ? `<p class="small" style="margin-top:6px">${note}</p>` : ''}
    ${formulaHTML(c, 2.8)}
    ${c.expl ? `<p class="expl">${esc(c.expl)}</p>` : ''}
    <p class="small muted" style="margin-top:6px">${tx('Kommer igen', 'Comes back')} ${fmtInterval(ms)}.</p>
  </div>
  <div class="actions result ${ok ? 'good' : 'wrong'}"><span class="verdict" aria-hidden="true">${ok ? tx('Rätt!', 'Correct!') : tx('Inte riktigt', 'Not quite')}</span>
    <span class="hint">${tx('Enter = fortsätt', 'Enter = continue')}</span><button type="button" class="primary" data-act="next">${tx('Fortsätt →', 'Continue →')}</button></div>`;

function finish(ok, note) {
  answered = true;
  ok ? sess.right++ : sess.wrong++;
  const card$ = document.getElementById('card');
  card$.querySelectorAll('.actions,.hint').forEach((n) => n.remove());
  if (step.kind === 'sentence') {
    answerSentence(step.m.nr, ok);
    card$.querySelector('.sentence').outerHTML = sentenceRow(step.m, true);   // luckan fylls i
    card$.insertAdjacentHTML('beforeend', sentenceFeedbackHTML(ok, note));
  } else {
    const ms = grade(step.c.id, ok);
    card$.insertAdjacentHTML('beforeend', feedbackHTML(ok, ms, note));
    for (const { track, n, rank } of checkMilestones().reverse()) {
      const m = milestoneState(track);
      const what = `${n === m.total ? tx('alla ', 'all ') : ''}${fmtN(n)} ${MS_UNIT[track]}`;
      card$.querySelector('.feedback').insertAdjacentHTML('afterbegin',
        `<div class="ms-hit" role="status">${rank ? `<span class="ms-hit-sym">${symbolSVG(card(rank.id), 3.2)}</span>` : ''}
          <span><b>${tx('Milstolpe nådd', 'Milestone reached')}: ${what}!</b>${rank ? tx(` Du är nu <b>${esc(rank.name)}</b>.`, ` You are now <b>${esc(rank.name)}</b>.`) : ''}${m.next ? tx(` Nästa: ${esc(m.rankNext?.name || '')} vid ${fmtN(m.next)}.`, ` Next: ${esc(m.rankNext?.name || '')} at ${fmtN(m.next)}.`) : ''}</span></div>`);
    }
  }
  card$.querySelector('[data-act="next"]').focus({ preventScroll: true });
  document.querySelector('.progress').outerHTML = progressBar();
}

function chooseOption(i) {
  if (answered || !step.options || i >= step.options.length) return;
  const btns = [...document.querySelectorAll('.opt')];
  btns.forEach((b) => { b.disabled = true; });
  const ok = i === step.answer;
  btns[i].classList.add(ok ? 'ok' : 'bad');
  if (!ok) btns[step.answer].classList.add('miss');
  const chosen = step.kind === 'sentence' ? (card(step.options[i].id)?.word || '') : step.options[i].word;
  finish(ok, ok ? '' : tx(`Du valde <b>${esc(chosen)}</b>.`, `You chose <b>${esc(chosen)}</b>.`));
}

function togglePal(i) {
  if (answered || !step.palette || i >= step.palette.length) return;
  const id = step.palette[i].id;
  if (step.mode === 'parts') {
    const k = step.sel.indexOf(id);
    k < 0 ? step.sel.push(id) : step.sel.splice(k, 1);
  } else step.sel.push(id);
  renderStep();
}

function checkStep() {
  if (answered) return;
  if (!step.sel.length) return;
  const { ok, order, skipped } = checkParts(step);
  const want = new Set(step.c.parts);
  if (ok && skipped) step.c.optInd.forEach((id) => want.delete(id));   // frivillig operator utelämnad – inte "missad"
  document.querySelectorAll('.pal').forEach((b, i) => {
    const id = step.palette[i].id, picked = step.sel.includes(id);
    b.disabled = true;
    b.classList.remove('on');   // annars döljer markeringen "vald" färgen för rätt/fel
    if (picked) b.classList.add(want.has(id) ? 'ok' : 'bad');
    else if (want.has(id)) b.classList.add('miss');
  });
  document.querySelectorAll('[data-unsel]').forEach((b) => { b.disabled = true; });
  let note = '';
  if (!ok) note = tx('Streckat = missad del, rött = ingår inte.', 'Dashed = missed part, red = not included.');
  else if (step.mode === 'build' && !order) note = tx('Rätt delar! BCI:s ordning:', 'Right parts! BCI order:');
  if (ok && skipped) note = (note ? note + ' ' : '') + tx('BCI tar även med operatorn.', 'BCI also includes the indicator.');
  finish(ok, note);
}

// ---------------------------------------------------------------- ordlista
let listQuery = '';
let listTab = 'started';   // 'started' | 'mine'
function list(rebuild = false) {
  const q = listQuery.trim().toLowerCase();
  let items;
  if (q) {
    const rank = (c) => {
      const syns = c.syns.map((s) => s.toLowerCase());
      return syns.includes(q) ? 0 : syns.some((s) => s.startsWith(q)) ? 1 : 2;
    };
    items = [...deck.values()].filter((c) => c.v.sv.toLowerCase().includes(q) || c.v.en.toLowerCase().includes(q))
      .sort((a, b) => rank(a) - rank(b) || b.score - a.score)
      .slice(0, 60);
  } else if (listTab === 'mine') {
    items = mineCards();
  } else {
    items = Object.keys(S.cards).map(card).filter(Boolean).sort((a, b) => S.cards[b.id].t - S.cards[a.id].t);
  }
  const dots = (c) => {
    const b = boxOf(c.id);
    if (b < 0) return `<div class="dots small muted">${tx('ej påbörjad', 'not started')}</div>`;
    return `<div class="dots" title="${tx(`Låda ${b} av 7`, `Box ${b} of 7`)}">${Array.from({ length: 7 }, (_, i) => `<i class="${i < b ? 'f' : ''}"></i>`).join('')}</div>`;
  };
  const star = (c) => (isMine(c.id) ? `<span class="star" title="${tx('I Mina ord', 'In My words')}">★</span>` : '');
  const html = items.map((c) => chip(c, 3.4).replace('</button>', `${star(c)}${dots(c)}</button>`)).join('');
  const box = document.getElementById('listgrid');
  if (box && !rebuild) { box.innerHTML = html || emptyList(q); return; }
  const tab = (k, label) => `<button type="button" data-tab="${k}" aria-pressed="${!q && listTab === k}">${label}</button>`;
  app.innerHTML = `<section class="panel">
    <input class="search" id="q" type="search" placeholder="${tx(`Sök bland ${fmtN(deck.size)} symboler`, `Search ${fmtN(deck.size)} symbols`)}" value="${esc(listQuery)}">
    <div class="tabs">${tab('started', tx('Påbörjade', 'Started'))}${tab('mine', `${tx('Mina ord', 'My words')} (${mineCards().length})`)}</div>
    <p class="small muted" style="margin-bottom:10px" id="listnote">${listNote(q)}</p>

// ---------------------------------------------------------------- säkerhetskopia
let pendingBackup = null;   // inläst fil som väntar på bekräftelse
function backupMsg(html, kind = '') {
  const box = document.getElementById('backupmsg');
  if (!box) return;
  box.className = `backup-msg small ${kind}`;
  box.innerHTML = html;
  if (html) box.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
/** Dela-menyn där den kan ta emot filer (iPhone: Spara i Filer, AirDrop, Mail …), annars en vanlig nedladdning. */
async function saveBackup() {
  const name = `bliss-glosor-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([exportBackup()], name, { type: 'application/json' });
  const words = Object.keys(S.cards).length;
  const done = () => backupMsg(tx(`Säkerhetskopian (${words} ord) är sparad som <b>${esc(name)}</b>.`, `The backup (${words} words) is saved as <b>${esc(name)}</b>.`), 'good');
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
      return done();
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;   // användaren stängde dela-menyn
  }
  try {
    const url = URL.createObjectURL(file);
    const a = Object.assign(document.createElement('a'), { href: url, download: name });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    done();
  } catch (_) {
    backupMsg(tx('Det gick inte att spara filen här. Öppna appen i webbläsaren och försök igen.', 'The file could not be saved here. Open the app in the browser and try again.'), 'bad');
  }
}
function loadBackupFile(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  f.text().then((text) => {
    const b = readBackup(text);
    if (!b) return backupMsg(tx('Filen är ingen säkerhetskopia från Bliss-glosor.', 'The file is not a Bliss Vocabulary backup.'), 'bad');
    pendingBackup = text;
    const when = b.saved ? new Date(b.saved).toLocaleString(lang() === 'en' ? 'en-GB' : 'sv-SE', { dateStyle: 'medium', timeStyle: 'short' }) : '';
    backupMsg(`<div class="confirm"><span>${tx(`Ersätta dina nuvarande framsteg med säkerhetskopian${when ? ` från ${when}` : ''} (${b.words} ord)?`,
      `Replace your current progress with the backup${when ? ` from ${when}` : ''} (${b.words} words)?`)}</span>
      <button type="button" class="yes" id="backup-yes">${tx('Läs in', 'Load')}</button><button type="button" class="ghost" id="backup-no">${tx('Avbryt', 'Cancel')}</button></div>`);
  }, () => backupMsg(tx('Filen kunde inte läsas.', 'The file could not be read.'), 'bad'));
}

function setView(v) {
  view = v;
  document.querySelectorAll('header nav button').forEach((b) => b.setAttribute('aria-current', String(b.dataset.view === v)));
  if (v === 'home') home();
  if (v === 'list') list();
  if (v === 'about') { about(); window.scrollTo(0, 0); }
  if (v === 'poesi') { poesi(); window.scrollTo(0, 0); }
}

document.querySelector('header nav').addEventListener('click', (e) => {
  const b = e.target.closest('[data-view]');
  if (b) { endModes(); setView(b.dataset.view); }
});

app.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.id === 'start') return startSession();
  if (t.id === 'focus' || t.dataset.act === 'focus') return startSession('mine');
  if (t.id === 'review' || t.dataset.act === 'review') return startSession('review');
  if (t.id === 'sentences' || t.dataset.act === 'sentences') return startSession('sentences');
  if (t.id === 'go-list') return setView('list');
  if (t.id === 'poem-open') return setView('poesi');
  if (view === 'poesi') {
    if (t.dataset.mag != null) return tapMagnet(t);
    if (t.dataset.placed != null) return showDetail(poem.words[+t.dataset.placed].id);
    if (t.id === 'poem-done') { poem.done = true; return poesi(); }
    if (t.id === 'poem-edit') { poem.done = false; return poesi(); }
    if (t.id === 'poem-clear') { Object.assign(poem, { words: [], hist: [], done: false }); newOpts(); return poesi(); }
    if (t.id === 'poem-undo') { undoWord(); return poesi(); }
    if (t.id === 'poem-shuffle') { poem.opts = []; newOpts(poem.words.length ? poem.words[poem.words.length - 1].id : null); return poesi(); }
  }
  if (t.id === 'backup-save') return saveBackup();
  if (t.id === 'backup-load') return document.getElementById('backup-file').click();
  if (t.id === 'backup-yes') {
    if (!pendingBackup || !importBackup(pendingBackup)) return backupMsg(tx('Säkerhetskopian kunde inte läsas in.', 'The backup could not be loaded.'), 'bad');
    pendingBackup = null;
    applyLang();
    home();
    return backupMsg(tx('Säkerhetskopian är inläst.', 'The backup has been loaded.'), 'good');
  }
  if (t.id === 'backup-no') { pendingBackup = null; return backupMsg(''); }
  if (t.id === 'copy-contact') {
    // Urklipp kan nekas (vissa inbäddade vyer) – markera då adressen så att den kan kopieras för hand.
    const done = () => { t.textContent = tx('Kopierad', 'Copied'); setTimeout(() => { t.textContent = tx('Kopiera adressen', 'Copy the address'); }, 2000); };
    const select = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('contact-addr')); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
    try { navigator.clipboard.writeText(CONTACT).then(done, select); } catch (_) { select(); }
    return;
  }
  if (t.dataset.tab) { listTab = t.dataset.tab; listQuery = ''; return list(true); }
  if (t.id === 'more' || t.dataset.act === 'more') { S.day.extra += 5; save(); return startSession(); }
  // Bekräftelse i sidan: confirm() fungerar inte i alla miljöer (t.ex. inbäddad som Artifact).
  if (t.id === 'reset') {
    document.getElementById('resetbox').innerHTML = `<div class="confirm"><span>${tx('Nollställa alla framsteg? Det går inte att ångra.', 'Reset all progress? This cannot be undone.')}</span>
      <button type="button" class="yes" id="reset-yes">${tx('Nollställ', 'Reset')}</button><button type="button" class="ghost" id="reset-no">${tx('Avbryt', 'Cancel')}</button></div>`;
    document.getElementById('reset-no').focus();
    return;
  }
  if (t.id === 'reset-yes') { resetProgress(); home(); return; }
  if (t.id === 'reset-no') { home(); return; }
  if (t.id === 'quit' || t.dataset.act === 'home') { endModes(); return setView('home'); }
  if (t.dataset.act === 'next') return advance();
  if (t.dataset.act === 'check') return checkStep();
  if (t.dataset.act === 'clear') { if (!answered) { step.sel = []; renderStep(); } return; }
  if (t.dataset.opt != null) return chooseOption(+t.dataset.opt);
  if (t.dataset.pal != null) return togglePal(+t.dataset.pal);
  if (t.dataset.unsel != null) { if (!answered) { step.sel.splice(+t.dataset.unsel, 1); renderStep(); } return; }
  // Delar/ord-chips öppnar detaljer — men inte mitt i en fråga (det skulle avslöja svaret).
  if (t.dataset.detail != null && (view !== 'session' || answered || step?.kind === 'intro' || !step)) showDetail(t.dataset.detail);
});

app.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'backup-file') return loadBackupFile(t);
  if (t.name === 'lang') return switchLang(t.value);
  if (t.dataset.mode) {
    S.settings.modes[t.dataset.mode] = t.checked;
    if (!Object.values(S.settings.modes).some(Boolean)) { S.settings.modes[t.dataset.mode] = true; t.checked = true; }
  }
  if (t.id === 'npd') S.settings.newPerDay = Math.max(1, Math.min(100, parseInt(t.value, 10) || 10));
  if (t.id === 'staff') S.settings.staff = t.checked;
  save();
  if (t.id === 'npd') home();
});

app.addEventListener('input', (e) => {
  if (e.target.id === 'q') {
    listQuery = e.target.value;
    document.getElementById('listnote').textContent = listNote(listQuery.trim());
    document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-pressed', String(!listQuery.trim() && b.dataset.tab === listTab)));
    list();
  }
});

dlg.addEventListener('click', (e) => {
  if (e.target === dlg || e.target.closest('[data-act="close"]')) return dlg.close();
  const m = e.target.closest('[data-mine]');
  if (m) {
    toggleMine(m.dataset.mine);
    showDetail(m.dataset.mine);
    if (view === 'home') home();
    if (view === 'list') list(true);
    return;
  }
  const t = e.target.closest('[data-detail]');
  if (t) showDetail(t.dataset.detail);
});

document.addEventListener('keydown', (e) => {
  if (view !== 'session' || dlg.open || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches('input,textarea')) return;
  if (e.key === 'Enter') {
    const btn = document.querySelector('#card .actions .primary, .panel .actions .primary');
    if (btn) { e.preventDefault(); btn.click(); }
    return;
  }
  if (e.key === 'Escape') return setView('home');
  if (!step || answered) return;
  if (/^[1-9]$/.test(e.key)) {
    const i = +e.key - 1;
    if (step.options) chooseOption(i);
    else if (step.palette) togglePal(i);
  }
  if (e.key === 'Backspace' && step.mode === 'build' && step.sel.length) { e.preventDefault(); step.sel.pop(); renderStep(); }
});

applyLang();
setView('home');
})();
</script>

  // PWA: service workern fungerar bara över http(s) — inte från file:// — och tyst fel är okej.
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('glosor-sw.js').catch(() => {}); });
  }
</script>
